<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Todos App</title>
  </head>
  <body>
    <h1 style="margin-top: 20px; text-align: center">Todos App</h1>
    <div class="container mt-5 border p-3 rounded shadow-lg">
      <h2>Update Your Todos</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="todo-name" class="form-label">New Todo Name</label>
          <input
            type="text"
            class="form-control"
            id="todo-name"
            name="todo_name"
            value="{{todo.todo_name}}"
          />
        </div>
        <div class="mb-3">
          <label for="todo-desc" class="form-label">New Todo Description</label>
          <textarea
            class="form-control"
            id="todo-desc"
            name="todo_desc"
            style="height: 200px"
          >
{{todo.todo_description}}</textarea
          >
        </div>
        <button type="submit" class="btn btn-outline-dark">Update Todo</button>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
