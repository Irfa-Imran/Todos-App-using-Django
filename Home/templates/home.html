<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Todos App</title>
  </head>
  <body>
    <h1 style="margin-top: 20px; text-align: center">Todos App</h1>
    <div class="container mt-5 border p-3 rounded shadow-lg">
      <h2>Enter Your Todos</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="todo-name" class="form-label">Todo Name</label>
          <input
            type="text"
            class="form-control"
            id="todo-name"
            name="todo_name"
          />
        </div>
        <div class="mb-3">
          <label for="todo-desc" class="form-label">Todo Description</label>
          <textarea
            class="form-control"
            id="todo-desc"
            name="todo_desc"
            style="height: 200px"
          ></textarea>
        </div>
        <button type="submit" class="btn btn-outline-dark">Add Todo</button>
      </form>
    </div>
    <div class="container mt-5">
      <h2>Todos</h2>
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Description</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for todo in todos %}
          <tr>
            <th scope="row">{{forloop.counter}}</th>
            <td>{{todo.todo_name}}</td>
            <td>{{todo.todo_description}}</td>
            <td>
              <a
                href="delete-todo/{{todo.id}}"
                class="btn btn-outline-danger mb-1"
                >Delete</a
              >
              <a href="update-todo/{{todo.id}}" class="btn btn-outline-primary"
                >Update</a
              >
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
